name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node scripts/prepare-development.mjs
      - run: node scripts/prepare-input.mjs
      - run: node scripts/verify-reference-annotations.mjs
      - run: node build-model.mjs
      - run: node scripts/predict-batch.mjs
      - run: node scripts/prepare-evaluation.mjs
      - run: node scripts/evaluate-recognition.mjs
      - name: Verify unreviewed evaluation has no scores
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync('local-data/evaluation/recognition-report.json', 'utf8'));
          assert.equal(report.status, 'not_evaluable');
          assert.equal(report.coverage.selected, 60);
          assert.equal(report.coverage.reviewed, 0);
          assert.equal(report.metrics, null);
          assert.deepEqual(report.predictions, []);
          assert.equal(report.independent_holdout, false);
          NODE
      - run: npm test
      - run: npm run check
