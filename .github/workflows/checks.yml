name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node scripts/prepare-development.mjs
      - run: node scripts/prepare-input.mjs
      - run: node build-model.mjs
      - run: node scripts/predict-batch.mjs
      - run: npm test
      - run: npm run check
